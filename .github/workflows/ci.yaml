name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: Linux
            runner: ubuntu-24.04-arm

          - os: macOS
            runner: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: clippy

      - name: Run clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings -D clippy::all

  test:
    name: Test
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Run tests
        run: cargo test --workspace

  insta:
    name: Snapshots
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Install cargo-insta
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-insta

      - name: Validate snapshots
        run: cargo insta test --workspace --check --unreferenced=reject

  integration-test:
    name: Integration Test
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read
      pull-requests: write
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-llvm-cov

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Run tests with coverage
        run: cargo llvm-cov --no-report --workspace

      - name: Generate combined coverage report
        run: cargo llvm-cov report > coverage-report.txt

      - name: Generate per-crate coverage summary
        run: |
          echo "## Per-Crate Coverage" > per-crate-coverage.txt
          echo "" >> per-crate-coverage.txt
          for crate in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name' | sort); do
            line_cov=$(cargo llvm-cov report -p "$crate" 2>/dev/null | grep "^TOTAL" | awk '{print $10}')
            if [ -n "$line_cov" ]; then
              printf "%-25s %s\n" "$crate" "$line_cov" >> per-crate-coverage.txt
            fi
          done

      - name: Build coverage comment
        if: github.event_name == 'pull_request'
        id: coverage
        run: |
          {
            echo 'comment<<EOF'
            echo '## Coverage Report'
            echo ''
            echo '### Workspace Total'
            echo '```'
            grep -E '^(Filename|-|TOTAL)' coverage-report.txt
            echo '```'
            echo ''
            echo '### Per-Crate Breakdown'
            echo '```'
            cat per-crate-coverage.txt
            echo '```'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Post coverage comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: coverage
          message: ${{ steps.coverage.outputs.comment }}

  cross-compile:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-26-intel

          - target: aarch64-apple-darwin
            runner: macos-26

          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04

          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: ${{ matrix.target }}

      - name: Install musl-tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build agent
        if: contains(matrix.target, 'linux')
        run: cargo build --package cella-agent --target ${{ matrix.target }}

      - name: Build CLI
        run: cargo build --package cella-cli --target ${{ matrix.target }}
